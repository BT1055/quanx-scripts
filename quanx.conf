;2026-09-28: 整合 QuanX 个人脚本套件（广告拦截+隐私保护+响应处理）
;2026-01-09: Openai分流改为Ai合集,增加Telegram策略组极其分流。部分修改
;2023-02-24: 部分修改
;2022-09-26: 增加对各个模块的说明(部分内容只适用于 1.1.0 以上版本)
;⚠️注意⚠️: 以下内容中，带";" "#"的都是注释符号，去掉前面的符号，该行才有效

;general 模块内为一些通用的设置参数项
[general]

;Quantumult X 会对 server_check_url 指定的网址进行相应测试，以确认节点的可用性
server_check_url= http://www.qualcomm.cn/generate_204
;节点延迟测试超时参数，需小于 5000 毫秒才生效
server_check_timeout=2000

;👍👍👍资源解析器，可用于自定义各类远程资源的转换
resource_parser_url= https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js

;👍👍geo_location_checker用于节点页面的节点信息展示
geo_location_checker=http://ip-api.com/json/?lang=zh-CN,https://raw.githubusercontent.com/I-am-R-E/Functional-Store-Hub/Master/GeoLocationChecker/QuantumultX/IP-API.js

;👍👍👍运行模式模块
;running_mode_trigger=filter, filter, asus-5g:all_direct, asus:all_proxy

;ssid_suspended_list，让 Quantumult X 在特定 Wi-Fi 网络下暂停工作
;ssid_suspended_list=Asus, Shawn-Wifi

;dns exclusion list中的域名将不使用fake-ip方式
;dns_exclusion_list=*.qq.com

;UDP 白名单
;udp_whitelist=53, 80-427, 444-65535

; UDP Drop名单
;udp_drop_list = 1900, 80

# fallback_udp_policy 仅支持 v1.0.19 以及之后的版本
fallback_udp_policy=direct

;下列表中的内容将不经过 QuantumultX的处理
;excluded_routes= 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8
;icmp_auto_reply=true

;指定 DoH 请求所使用的 User-Agent
;doh_user_agent=Agent/1.0

;指定服务器测试时所使用的 User-Agent
;server_check_user_agent = Agent/1.0

// 默认当 DNS 层面某domain 被reject时，将返回loopback IP
;dns_reject_domain_behavior = loopback



[dns]
; 禁用系统 DNS（no-system） 以及 ipv6
;no-system
;no-ipv6

;circumvent-ipv4-answer, circumvent-ipv6-answer 参数
;circumvent-ipv4-answer = 127.0.0.1, 0.0.0.0
;circumvent-ipv6-answer = ::

//如需使用 DoH3，请开启下面参数
;prefer-doh3

;指定 dns 服务器，并发响应选取最优结果
server=223.5.5.5
server=119.29.29.29

;如指定 doh 服务
;doh-server=xxx.com, excluded_ssids=SSID1, SSID2

;如指定了 DoQ 服务，则 DoH 以及其它 dns解析均失效
;doq-server = quic://dns.adguard.com

;指定域名解析dns
;server=/*.taobao.com/223.5.5.5, excluded_ssids=My-Wifi, Your-Wifi
;server=/example1.com/8.8.4.4
;address=/example5.com/192.168.16.18


[task_local]
;包含3种类型: cron 定时任务，UI交互脚本，网络切换脚本

