#本地复写规则
[rewrite_local]

// ==================== QuanX 个人脚本套件 ====================
// 功能：广告拦截 + 隐私保护 + 响应处理 + 自定义扩展
// 脚本地址：https://github.com/BT1055/quanx-scripts

// 请求阶段：广告拦截 + 隐私保护（去追踪参数/屏蔽统计/清理请求头）
^https?://.* url script-request-header https://raw.githubusercontent.com/BT1055/quanx-scripts/main/main.js

// 响应阶段：响应体处理（移除追踪脚本/自定义响应处理）
^https?://.* url script-response-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/main.js

// ==================== QuanX 个人脚本套件 END ====================

// ==================== 京东比价 ====================
// 拦截商品详情接口（新接口 getWareBusiness），弹通知显示当前价/原价/直降
// 需在下方 [mitm] hostname 中包含 api.m.jd.com
^https?:\/\/api\.m\.jd\.com\/client\.action url script-response-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/jd_price.js
// ==================== 京东比价 END ====================

#谷歌重定向
^https?:\/\/(www.)?(g|google)\.cn url 302 https://www.google.com
^https?:\/\/(ditu|maps).google\.cn url 302 https://maps.google.com


