# ============================================================
#  QuanX 个人脚本套件 - 重写规则
#  使用方法：
#  1. 将 main.js 上传到 GitHub Gist 或其他可直链访问的地方
#  2. 把下方 https://raw.githubusercontent.com/BT1055/quanx-scripts/main/main.js 替换为你的脚本直链
#     或者在 Quantumult X「脚本」中添加本地脚本，用脚本名替换
#  3. 在 Quantumult X「重写」中导入本文件
# ============================================================

# ---------- 请求阶段：广告拦截 + 隐私保护 ----------
# 对所有 HTTP/HTTPS 请求触发（会有一定性能开销，但能全面保护）
^https?://.* url script-request-header https://raw.githubusercontent.com/BT1055/quanx-scripts/main/main.js

# 如果你希望只对特定域名触发，可以用以下格式（按需修改）：
# ^https?://.*\.(example|test)\.com/.* url script-request-header https://raw.githubusercontent.com/BT1055/quanx-scripts/main/main.js

# ---------- 响应阶段：响应体处理 ----------
# 对文本类响应触发（HTML/JSON/JS/CSS）
^https?://.* url script-response-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/main.js

# 如果你希望只对特定内容类型触发，可以用更精确的规则：
# ^https?://.*\.(html|json|js|css)(\?.*)?$ url script-response-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/main.js

# ============================================================
#  可选：额外的 URL 重写规则（不经过脚本，直接重写）
# ============================================================

# 示例：将 HTTP 重定向到 HTTPS
# ^http://(?!localhost|127\.0\.0\.1).* url 302 https://$1

# 示例：移除 URL 中的锚点追踪
# ^https?://.*#.* url reject-200

# 示例：阻止特定资源类型（图片/视频广告）
# ^https?://.*/ad[s]?/.*\.(jpg|png|gif|mp4) url reject-200
