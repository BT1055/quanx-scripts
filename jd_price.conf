# ============================================================
#  京东比价 - 重写规则（独立文件）
#  只包含京东比价，不影响其他规则
#
#  使用前提（缺一不可）：
#  1. 在「MitM → 主机名」中手动添加：api.m.jd.com
#  2. 安装并在 iOS 系统设置中「信任」Quantumult X 根证书
#     （设置 → 通用 → 关于本机 → 证书信任设置）
#  3. 开启「重写」和「MitM」总开关
# ============================================================

# 京东比价（全接口扫描版）：不依赖 functionId，扫描 api.m.jd.com 所有响应，
# 发现「skuId + 价格」即弹比价通知（新文件名 jd_compare.js 规避脚本缓存）
^https?:\/\/api\.m\.jd\.com url script-response-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/jd_compare.js