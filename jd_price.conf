# ============================================================
#  京东比价 - 重写规则（基于社区验证方案）
#  数据来源：慢慢买（需先获取 ck，一次性）
#
#  使用前提（缺一不可）：
#  1. 在「MitM → 主机名」中添加：
#       in.m.jd.com
#       apapia-sqk-weblogic.manmanbuy.com
#  2. 安装并在 iOS 系统设置中「信任」Quantumult X 根证书
#     （设置 → 通用 → 关于本机 → 证书信任设置）
#  3. 开启「重写」和「MitM」总开关
#  4. 首次使用：打开【慢慢买】App，点击【我的】，
#     提示「获取ck成功🎉」后即可正常比价
# ============================================================

# 拦截京东商品详情页（明文接口，从 URL 提取 skuId）
^https?:\/\/in\.m\.jd\.com\/product\/graphext\/\d+\.html url script-response-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/jd_price_mmb.js

# 捕获慢慢买 ck（首次打开慢慢买 App 时触发）
^https?:\/\/apapia-sqk-weblogic\.manmanbuy\.com\/baoliao\/center\/menu$ url script-request-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/jd_price_mmb.js
