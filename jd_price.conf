# ============================================================
#  京东比价 - 重写规则（社区参考脚本版）
#  基于 https://raw.githubusercontent.com/wf021325/qx/master/js/jd_price.js
#  仅扩展触发域名，兼容新版京东详情页
#
#  使用前提（缺一不可）：
#  1. 在「MitM → 主机名」中添加：
#       item.m.jd.com
#       item.jd.com
#       in.m.jd.com
#       apapia-sqk-weblogic.manmanbuy.com
#       *.manmanbuy.com
#  2. 安装并在 iOS 系统设置中「信任」Quantumult X 根证书
#  3. 开启「重写」和「MitM」总开关
#  4. 手机已安装【慢慢买】App
# ============================================================

# 拦截京东商品详情页（比价主逻辑，社区参考脚本）
^https?:\/\/in\.m\.jd\.com\/product\/graphext\/\d+\.html url script-response-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/jd_price.js
^https?:\/\/item\.m\.jd\.com\/\d+\.html url script-response-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/jd_price.js
^https?:\/\/item\.jd\.com\/\d+\.html url script-response-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/jd_price.js

# ck 捕获：慢慢买（社区参考脚本原版逻辑，保留）
^https?:\/\/apapia-sqk-weblogic\.manmanbuy\.com\/baoliao\/center\/menu$ url script-request-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/jd_price.js

# ck 捕获（备用，宽松匹配慢慢买新版域名，包含设备ID时保存）
^https?:\/\/(apapia-sqk-weblogic|apapia-common|apapia-history-weblogic|api)\.manmanbuy\.com url script-request-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/jd_ck2.js
