# ============================================================
#  京东比价 - 重写规则（独立文件）
#  只包含京东比价，不影响其他规则
#
#  使用前提（缺一不可）：
#  1. 在「MitM → 主机名」中手动添加：api.m.jd.com
#  2. 安装并在 iOS 系统设置中「信任」Quantumult X 根证书
#     （设置 → 通用 → 关于本机 → 证书信任设置）
#  3. 开启「重写」和「MitM」总开关
# ============================================================

# 京东字段名探针：进商品页后把响应 JSON 的所有字段名弹出来（不显示值，隐私安全），
# 用于定位价格/原价字段名（新文件名 jd_fields.js 规避脚本缓存）
^https?:\/\/api\.m\.jd\.com url script-response-body https://raw.githubusercontent.com/BT1055/quanx-scripts/main/jd_fields.js